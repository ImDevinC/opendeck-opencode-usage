<!DOCTYPE html>
<html lang="en">
	<head>
		<script>
			let websocket = null;
			let context = null;

			function connectOpenActionSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const actionInfo = JSON.parse(inActionInfo);
				context = actionInfo.context;
				websocket = new WebSocket("ws://localhost:" + inPort);
				websocket.onopen = () => {
					websocket.send(JSON.stringify({
						event: inRegisterEvent,
						uuid: inPropertyInspectorUUID,
					}));
				};

				const settings = actionInfo.payload.settings || {};
				const mode = document.getElementById("mode");
				const apiKey = document.getElementById("apiKey");
				const showPercent = document.getElementById("showPercent");

				mode.value = settings.mode ?? "rolling";
				apiKey.value = settings.api_key ?? "";
				showPercent.checked = settings.show_percent !== false;

				websocket.onmessage = (event) => {
					const data = JSON.parse(event.data);
					if (data.event == "didReceiveSettings") {
						const s = data.payload.settings || {};
						if (s.mode) mode.value = s.mode;
						if (s.api_key != null) apiKey.value = s.api_key;
						if (s.show_percent != null) showPercent.checked = s.show_percent;
					}
				};
			}

			function update() {
				if (!websocket || !context) return;
				websocket.send(JSON.stringify({
					event: "setSettings",
					context: context,
					payload: {
						mode: document.getElementById("mode").value,
						api_key: document.getElementById("apiKey").value,
						show_percent: document.getElementById("showPercent").checked,
					},
				}));
			}

			const connectElgatoStreamDeckSocket = connectOpenActionSocket;
		</script>

		<style>
			* {
				font-family: system-ui, sans-serif;
				font-size: 16px;
				color: oklch(92.2% 0 0);
			}
			body {
				margin: 16px;
				background-color: oklch(26.9% 0 0);
			}
			label {
				display: block;
				margin-bottom: 4px;
				margin-top: 12px;
				font-size: 13px;
				color: oklch(78% 0 0);
			}
			select,
			input {
				width: 100%;
				box-sizing: border-box;
				padding: 6px;
				background-color: oklch(37.1% 0 0);
				border: 1px solid oklch(43.9% 0 0);
				border-radius: 8px;
			}
			.hint {
				font-size: 12px;
				color: oklch(70% 0 0);
				margin-top: 4px;
			}
		</style>
	</head>

	<body>
		<div>
			<label for="mode">Mode</label>
			<select id="mode" onchange="update();">
				<option value="rolling">Rolling</option>
				<option value="weekly">Weekly</option>
				<option value="monthly">Monthly</option>
			</select>
		</div>
		<div>
			<label for="apiKey">OpenCode API Key</label>
			<input id="apiKey" oninput="update();" type="password" placeholder="opencode_..." autocomplete="off" />
			<div class="hint">Get it from the opencode CLI config. Stored in this action's settings.</div>
		</div>
		<div>
			<label for="showPercent">
				<input id="showPercent" type="checkbox" onchange="update();" style="width:auto; vertical-align:middle;" />
				Show percentage
			</label>
		</div>
	</body>
</html>
